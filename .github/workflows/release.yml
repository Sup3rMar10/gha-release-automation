name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest discover -s tests -v

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create the release
      id-token: write          # sign the provenance attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0       # full history so the changelog can be built from tags
      - name: Validate the tag looks like vMAJOR.MINOR.PATCH
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag '$TAG' is not vX.Y.Z"; exit 1; }
      - name: Build the artifact and its checksums
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="hello-$TAG/" -o "dist/hello-$TAG.tar.gz" HEAD
          (cd dist && sha256sum "hello-$TAG.tar.gz" > SHA256SUMS)
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/hello-*.tar.gz
      - name: Changelog from commits since the previous tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          prev=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          echo "changelog range: ${prev:-<start of history>}..$TAG"
          git log --pretty='- %s (%h)' "$range" > notes.md
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag

  verify:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download the published assets and check them
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir check
          (cd check && sha256sum -c SHA256SUMS)
          gh attestation verify "check/hello-$TAG.tar.gz" --repo "$GITHUB_REPOSITORY"
